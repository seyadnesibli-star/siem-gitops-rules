title: QRadar Windows Firewall Tampering via Netsh
id: q-1004-firewall-tampering
status: experimental
description: Detects QRadar offense triggered by command line attempts to disable Windows Firewall profiles.
logsource:
  product: qradar
  service: sysmon
detection:
  selection:
    EventID: 1
    Image: "*\\netsh.exe"
    CommandLine: "*firewall* AND *set state off*"
  condition: selection
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.004
