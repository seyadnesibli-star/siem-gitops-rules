title: QRadar Suspicious Remote Service Creation
id: q-1003-remote-service
status: experimental
description: Detects creation of Windows services pointing to suspicious paths or remote systems.
logsource:
  product: qradar
  service: win-security
detection:
  selection:
    EventID: 4697
    ImagePath: "*\\Temp\\*"
  condition: selection
level: high
tags:
  - attack.persistence
  - attack.t1543.003
