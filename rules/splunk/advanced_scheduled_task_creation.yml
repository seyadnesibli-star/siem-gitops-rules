title: Suspicious Scheduled Task Creation via Schtasks
id: c8d9e0f1-a2b3-4567-defa-123456789018
status: experimental
description: Detects creation of scheduled tasks executing suspicious binaries or payloads from temporary paths for persistence.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Advanced SOC Engineering
logsource:
  product: splunk
  service: sysmon
detection:
  selection_process:
    EventCode: 1
  selection_image:
    Image|endswith: '\schtasks.exe'
  selection_args:
    CommandLine|contains:
      - '/create'
      - '-create'
  selection_payload:
    CommandLine|contains:
      - '\Temp\'
      - 'powershell'
      - 'cmd.exe'
  condition: selection_process and selection_image and selection_args and selection_payload
falsepositives:
  - Legitimate administrative task scheduling scripts
level: high
tags:
  - attack.persistence
  - attack.t1053.005
