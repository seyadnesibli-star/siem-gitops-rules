title: Suspicious Remote Windows Service Creation
id: d5e6f7a8-b9c0-123-efab-123456789025
status: experimental
description: Detects creation of Windows services targeting remote hosts via sc.exe, indicating potential lateral movement or remote administration tool deployment.
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: Advanced SOC Engineering
logsource:
  product: splunk
  service: sysmon
detection:
  selection_process:
    EventCode: 1
  selection_image:
    Image|endswith: '\sc.exe'
  selection_args:
    CommandLine|contains:
      - '\\'
      - 'create'
      - 'binPath='
  condition: selection_process and selection_image and selection_args
falsepositives:
  - Authorized enterprise remote management utilities
level: high
tags:
  - attack.lateral_movement
  - attack.t1543.003
