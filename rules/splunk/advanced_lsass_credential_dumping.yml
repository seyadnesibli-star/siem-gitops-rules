title: Potential Credential Dumping via LSASS Handle Request
id: e0f1a2b3-c4d5-6789-fabc-123456789020
status: experimental
description: Detects suspicious process opening handles to LSASS with high privileges typical of credential dumping tools like Mimikatz.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Advanced SOC Engineering
logsource:
  product: splunk
  service: sysmon
detection:
  selection_event:
    EventCode: 10
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    GrantedAccess|contains:
      - '0x1410'
      - '0x1010'
      - '0x1F3FFF'
  condition: selection_event and selection_target and selection_access
falsepositives:
  - Legitimate security endpoint protection or antivirus scanning tools
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
