name: Deploy QRadar Detection Rules

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'rules/qradar/**'
      - 'scripts/deploy_qradar.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run QRadar Deployment Script
        env:
          QRADAR_HOST: ${{ secrets.QRADAR_HOST }}
          QRADAR_TOKEN: ${{ secrets.QRADAR_TOKEN }}
        run: |
          python scripts/deploy_qradar.py
